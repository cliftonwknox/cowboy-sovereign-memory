<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Ubuntu, 'DejaVu Sans', sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#0a0e1f"/>
      <stop offset="0.45" stop-color="#241634"/>
      <stop offset="0.72" stop-color="#5d2c39"/>
      <stop offset="0.86" stop-color="#9c4f33"/>
      <stop offset="1"   stop-color="#e0913a"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6cf6a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f6cf6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe39b"/>
      <stop offset="1" stop-color="#f0ad44"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1280" height="640" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#f3ead6">
    <circle cx="140" cy="80"  r="1.7" opacity="0.9"/>
    <circle cx="300" cy="140" r="1.2" opacity="0.6"/>
    <circle cx="520" cy="70"  r="1.5" opacity="0.8"/>
    <circle cx="760" cy="120" r="1.1" opacity="0.5"/>
    <circle cx="980" cy="60"  r="1.6" opacity="0.85"/>
    <circle cx="1150" cy="150" r="1.2" opacity="0.6"/>
    <circle cx="1090" cy="95" r="1.0" opacity="0.5"/>
    <circle cx="420" cy="180" r="1.0" opacity="0.45"/>
  </g>
  <!-- lone star (the bright one) -->
  <g transform="translate(1015,128)" fill="#fbe39b">
    <path d="M0,-13 L3,-3 L13,0 L3,3 L0,13 L-3,3 L-13,0 L-3,-3 Z"/>
    <circle cx="0" cy="0" r="20" fill="url(#moonGlow)"/>
  </g>

  <!-- low amber moon -->
  <circle cx="935" cy="430" r="150" fill="url(#moonGlow)"/>
  <circle cx="935" cy="430" r="92" fill="url(#moon)"/>

  <!-- mesa silhouettes (back to front, frontier) -->
  <path d="M0,470 L0,520 L180,520 L180,455 L470,455 L470,520 L760,520 L760,470 L1280,470 L1280,520 L1280,640 L0,640 Z" fill="#3a2336" opacity="0.85"/>
  <path d="M0,520 L250,520 L250,495 L540,495 L540,545 L900,545 L900,505 L1180,505 L1180,530 L1280,530 L1280,640 L0,640 Z" fill="#1f1428"/>
  <path d="M0,560 L1280,560 L1280,640 L0,640 Z" fill="#0c0813"/>

  <!-- scanlines (phosphor terminal nod) -->
  <g fill="#000000" opacity="0.06">
    <rect x="0" y="0"  width="1280" height="2"/>
    <rect x="0" y="8"  width="1280" height="2"/>
    <rect x="0" y="16" width="1280" height="2"/>
  </g>
  <rect width="1280" height="640" fill="none"/>

  <!-- cowboy hat (hand-drawn) -->
  <g transform="translate(150,250)" fill="#f3ead6">
    <ellipse cx="60" cy="60" rx="78" ry="15"/>
    <path d="M14,58 C16,18 28,4 60,4 C92,4 104,18 106,58 C90,50 74,47 60,47 C46,47 30,50 14,58 Z"/>
    <path d="M18,54 C30,48 44,46 60,46 C76,46 90,48 102,54" fill="none" stroke="#c98a3a" stroke-width="4"/>
  </g>

  <!-- title block -->
  <text x="150" y="392" fill="#f0a93a" font-size="34" font-weight="700" letter-spacing="7">COWBOY CLAUDE'S</text>
  <text x="148" y="470" fill="#f6efdd" font-size="82" font-weight="800" letter-spacing="2">SOVEREIGN MEMORY</text>
  <text x="152" y="512" fill="#cdbfa6" font-size="26">A local, private, self-tending memory for Claude Code.</text>

  <!-- bottom strip -->
  <text x="152" y="586" fill="#9a8c74" font-size="20" letter-spacing="1">ships empty &#160;·&#160; runs anywhere &#160;·&#160; your data never leaves your machine</text>
  <text x="1128" y="612" fill="#6f6450" font-size="18" text-anchor="end" letter-spacing="2">SOVEREIGN BY DESIGN</text>
</svg>
